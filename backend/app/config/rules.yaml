# ---------------------------------------------------------------------------
# Single source of truth for every threshold and rule in the pipeline.
# Nothing in the code hard-codes a numeric limit: services read this file.
# ---------------------------------------------------------------------------

app:
  name: Maatram Verify
  programme: Maatram HackForge 2026-27
  problem: MH26-01
  timezone: Asia/Kolkata

uploads:
  max_mb: 15
  allowed_extensions: [pdf, jpg, jpeg, png]
  # Magic bytes are the authority, extensions only route the parser.
  magic:
    pdf: ["25504446"]          # %PDF
    jpeg: ["FFD8FF"]
    png: ["89504E470D0A1A0A"]
  max_pages: 12
  min_bytes: 1024

ocr:
  engine: tesseract            # tesseract | paddle
  language: eng
  render_dpi: 300
  upscale_below_dpi: 180
  upscale_factor: 1.6
  deskew_max_degrees: 12
  denoise_strength: 7
  adaptive_block: 31
  adaptive_c: 11
  page_segmentation_modes: [6, 4, 11]
  min_word_confidence: 45
  low_confidence: 62           # a field below this goes to manual review

subjects:
  # Canonical subjects a complete Class 12 mark sheet must carry. Per-class
  # lists below drive the application form (Phase 1) and the class-specific
  # completeness checks that follow.
  required:
    - Mathematics
    - English
    - Physics
    - Chemistry
  classes:
    "10":
      - Mathematics
      - Science
      - Social Science
      - English
      - Tamil
    "11":
      - Mathematics
      - English
      - Physics
      - Chemistry
    "12":
      - Mathematics
      - English
      - Physics
      - Chemistry
  # Alias map for normalisation. Matching is case/punctuation-insensitive and
  # also consults rapidfuzz for anything the map misses.
  aliases:
    Mathematics: [maths, math, mathematics i, mathematics 1, mat, maths i]
    English: [eng, english i, english 1, english language]
    Physics: [phy, physics i, physics 1]
    Chemistry: [chem, chemistry i, chemistry 1]
    Computer Science: [cs, comp sci, computer applications, computer science i]
    Biology: [bio, botany, zoology, biological science]
    Accountancy: [accounts, accountancy i, acc]
    Economics: [eco, economics i]
    Business Studies: [bst, business studies i]
    History: [hist, history i]
    Geography: [geo, geography i]
    Tamil: [tam, tamil i]
  fuzzy_threshold: 82          # rapidfuzz WRatio, 0-100
  mark_tolerance: 0            # exact integer marks unless a rule overrides

documents:
  # Document types are configuration, not code. Every upload is classified
  # from its printed text with keyword scoring; the applicant can always
  # override the detected type before the checks run.
  classifier:
    min_score: 3
    ambiguous_margin: 2
    auto_dpi: 160
    low_text_words: 8
    keywords:
      marksheet_10:
        title:
          - secondary school leaving certificate
          - class x
          - class 10
          - 10th standard
          - matriculation
          - sslc
        body: [science, social science, mathematics, tamil, marks, register]
      marksheet_11:
        title:
          - higher secondary first year
          - first year
          - class xi
          - class 11
          - 11th standard
          - "+1"
        body: [physics, chemistry, mathematics, english, marks, register]
      marksheet_12:
        title:
          - higher secondary certificate
          - higher secondary examination
          - second year
          - class xii
          - class 12
          - 12th standard
          - "+2"
        body: [physics, chemistry, mathematics, english, marks, register]
      aadhaar:
        title:
          - aadhaar
          - aadhar
          - unique identification authority
          - uidai
          - government of india
        body: [year of birth, date of birth, gender, address, vid, enrolment]
      income_certificate:
        title:
          - income certificate
          - annual income certificate
          - income and asset certificate
        body: [annual income, income, issued, revenue, taluk, family]
      community_certificate:
        title:
          - community certificate
          - caste certificate
        body: [community, category, backward class, scheduled caste, scheduled tribe, revenue]
      first_graduate_certificate:
        title:
          - first graduate certificate
          - first graduate
        body: [graduate, father, mother, issued, education]
  kinds:
    marksheet_10:
      label: Class 10 mark sheet
      short: Class 10
      extractor: marksheet
      class_level: 10
      slot: multiple
      required_fields: [name, register_number, exam_year, subjects]
      generic_required: false
    marksheet_11:
      label: Class 11 mark sheet
      short: Class 11
      extractor: marksheet
      class_level: 11
      slot: multiple
      required_fields: [name, register_number, exam_year, subjects]
      generic_required: false
    marksheet_12:
      label: Class 12 mark sheet
      short: Class 12
      extractor: marksheet
      class_level: 12
      slot: multiple
      required_fields: [name, register_number, exam_year, subjects]
      generic_required: false
    aadhaar:
      label: Aadhaar
      short: Aadhaar
      extractor: aadhaar
      slot: single
      required_fields: [aadhaar_number, name, birth_detail]
    income_certificate:
      label: Income certificate
      short: Income
      extractor: income
      slot: single
      required_fields: [name, certificate_number, annual_income, issue_date]
    community_certificate:
      label: Community certificate
      short: Community
      extractor: community
      slot: single
      required_fields: [name, certificate_number, community, issue_date]
    first_graduate_certificate:
      label: First graduate certificate
      short: First graduate
      extractor: first_graduate
      slot: single
      required_fields: [name, certificate_number, first_graduate, issue_date]
    photo:
      label: Profile photo
      short: Photo
      extractor: photo
      slot: single
      required_fields: []
  field_labels:
    name: Name
    register_number: Register number
    exam_year: Examination year
    subjects: Subject rows
    aadhaar_number: Aadhaar number
    birth_detail: Date or year of birth
    date_of_birth: Date of birth
    year_of_birth: Year of birth
    certificate_number: Certificate number
    annual_income: Annual income
    issue_date: Issue date
    community: Community
    father_name: Father's name
    first_graduate: First graduate status

aadhaar:
  number_length: 12
  mask_prefix: "XXXX XXXX"
  qr:
    # A missing QR is a warning, not a rejection: photocopies and older cards
    # often lose it. A decoded QR that disagrees with the printed number is a
    # hard failure.
    required: false
    mismatch_severity: critical

income:
  max_annual_income: 250000
  validity_months: 12
  future_tolerance_days: 0

community:
  known_values:
    - BC
    - MBC
    - SC
    - ST
    - DNC
    - OBC
    - GENERAL
    - BACKWARD CLASS
    - MOST BACKWARD CLASS
    - SCHEDULED CASTE
    - SCHEDULED TRIBE
  future_tolerance_days: 30

first_graduate:
  future_tolerance_days: 30

validation:
  name_fuzzy_threshold: 86
  father_name_fuzzy_threshold: 88
  address_fuzzy_threshold: 72
  register_number_min_confidence: 55
  duplicate_phash_distance: 8  # =< this counts as a near duplicate
  class_years:
    max_gap_years: 3            # a longer break between classes is not a normal progression
  subject_group:
    enabled: true
    min_overlap: 0.5            # Jaccard overlap of Class 11 and 12 subjects
    ignored_subjects: [English, Tamil]
  overall:
    flag_mark_mismatch: true
    flag_photo_fail: true
    flag_missing_data: true
    flag_identity_conflict: true

photo:
  min_width: 300
  max_width: 6000
  min_height: 400
  max_height: 8000
  min_aspect_ratio: 0.66       # width / height, portrait
  max_aspect_ratio: 0.82
  min_size_kb: 10
  max_size_kb: 8192
  allowed_formats: [JPEG, PNG]
  orientation: portrait
  min_brightness: 55           # mean luminance 0-255
  max_brightness: 215
  min_sharpness: 60            # variance of Laplacian
  max_blank_ratio: 0.72        # fraction of near-white pixels
  min_ink_ratio: 0.003         # some actual subject must be present
  face_check: true
  face_scale_factor: 1.1
  face_min_neighbors: 5
  face_min_size_ratio: 0.08
  blank_pixel_threshold: 245
  ink_pixel_threshold: 160       # pixels at or below this count as subject detail

security:
  bcrypt_rounds: 12
  login_rate_limit: 8
  login_rate_window_seconds: 300
  max_failed_logins_before_audit: 3

evaluation:
  dataset: synthetic-v2
  cases: 24
  class_11_cases: 6
  seed: 2601
  min_field_accuracy: 0.90   # target shown on the accuracy page
  min_mismatch_recall: 0.85
  min_photo_accuracy: 0.90
  min_document_field_accuracy: 0.90
